<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chip-aus – Arbeitszeitrechner</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #e0e0e2;
    --accent: #0071e3;
    --accent-text: #ffffff;
    --bavaria-blue: #0069b4;
    --bavaria-diamond: linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%, #fff), linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%, #fff);
    --warn-bg: #fff4e5;
    --warn-border: #f5a623;
    --warn-text: #7a4a00;
    --danger: #d0021b;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #9a9a9e;
      --border: #333336;
      --accent: #0a84ff;
      --accent-text: #ffffff;
      --warn-bg: #3a2c00;
      --warn-border: #b8860b;
      --warn-text: #ffd479;
      --danger: #ff453a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 4px 0 20px;
    text-align: center;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .row-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .row-label-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .row-label-line .row-label { margin-bottom: 0; }
  .progress-pct {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .progress-pct.over { color: var(--accent); }
  .progress-track {
    height: 30px;
    border-radius: 10px;
    background: #0b0c0d;
    border: 1px solid var(--border);
    overflow: hidden;
    position: relative;
    transition: background 0.6s ease;
  }
  .progress-track.is-day { background: #ffffff; }
  .progress-track.is-night { background: #0b0c0d; }
  .progress-flag {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 0%;
    transition: width 0.5s ease;
    background-image: var(--bavaria-diamond);
    background-size: 22px 22px;
    background-position: 0 0, 11px 11px;
    background-color: var(--bavaria-blue);
  }
  .progress-flag.over-cap { box-shadow: inset -3px 0 0 var(--accent); }
  .progress-car {
    position: absolute;
    right: -9px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 19px;
    line-height: 1;
    filter: drop-shadow(0 1px 1.5px rgba(0,0,0,0.4));
    pointer-events: none;
  }
  .timeline-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    margin-top: 8px;
  }
  .soll-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .soll-row input {
    width: 90px;
    font-size: 18px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    text-align: center;
  }
  .punch-row-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .swipe-delete {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: 84px;
    border: none;
    background: var(--danger);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .punch-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 0;
    position: relative;
    background: var(--card);
    touch-action: pan-y;
    transition: transform 0.18s ease;
  }
  .punch-tag {
    font-size: 13px;
    font-weight: 700;
    width: 46px;
    flex-shrink: 0;
    text-align: center;
    padding: 4px 0;
    border-radius: 8px;
  }
  .punch-tag.an { background: var(--bavaria-blue); color: #fff; }
  .punch-tag.aus { background: rgba(208,2,27,0.12); color: var(--danger); }
  .punch-row input[type="time"] {
    flex: 1;
    font-size: 18px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .del-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    padding: 4px 8px;
    cursor: pointer;
  }
  .del-btn:hover { color: var(--danger); }
  .punch-row.swiped .del-btn { opacity: 0; pointer-events: none; }
  .add-btn {
    width: 100%;
    margin-top: 6px;
    padding: 10px;
    border-radius: 10px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--accent);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .toggle-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: var(--radius);
    font-size: 18px;
    font-weight: 700;
    color: #14171b;
    text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 2px #fff, 0 0 5px rgba(255,255,255,0.8);
    cursor: pointer;
    margin-bottom: 16px;
    transition: transform 0.06s ease, filter 0.15s ease;
  }
  .toggle-btn:hover { filter: brightness(1.06); }
  .toggle-btn:active { transform: scale(0.985); }
  .toggle-btn.start {
    background-image: var(--bavaria-diamond);
    background-color: #4f9468;
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  .toggle-btn.stop {
    background-image: var(--bavaria-diamond);
    background-color: #c15c53;
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  .toggle-btn .btn-icon { width: 13px; height: 13px; flex-shrink: 0; background: #14171b; box-shadow: 0 0 0 1.5px #fff; }
  .toggle-btn.start .btn-icon { border-radius: 50%; }
  .toggle-btn.stop .btn-icon { border-radius: 3px; }
  .card-hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: -6px;
    margin-bottom: 10px;
  }
  .error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 8px;
  }
  .stat {
    text-align: center;
    padding: 6px 0;
  }
  .stat-label {
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 44px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .stat-value.small {
    font-size: 30px;
  }
  .stat-value.good { color: var(--bavaria-blue); }
  .stat-value.danger { color: var(--danger); }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 14px 0;
  }
  .substats {
    display: flex;
    gap: 10px;
  }
  .substats .stat { flex: 1; }
  .warn-banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-text);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.45;
    margin-bottom: 16px;
  }
  .warn-banner b { display: block; margin-bottom: 4px; font-size: 15px; }
  .countdown-banner{
    position:fixed;
    left:50%;
    bottom:110px;
    transform:translateX(-50%);
    z-index:50;
    background:rgba(18,18,18,.94);
    border:2px solid var(--accent);
    border-radius:20px;
    padding:14px 30px;
    font-size:2.6rem;
    font-weight:800;
    color:var(--accent);
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    pointer-events:none;
    text-align:center;
  }
  .countdown-banner.urgent{
    border-color:var(--danger);
    color:var(--danger);
    animation:countdown-pulse .5s ease-in-out infinite;
  }
  .countdown-banner.done{
    border-color:var(--accent);
    color:var(--accent);
    font-size:1.7rem;
    animation:none;
  }
  @keyframes countdown-pulse{
    0%,100%{transform:translateX(-50%) scale(1);}
    50%{transform:translateX(-50%) scale(1.18);}
  }
  .meta {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Arbeitszeitrechner</h1>

  <button class="toggle-btn start" id="toggleBtn" type="button">
    <span class="btn-icon"></span>Start
  </button>

  <div class="card">
    <div class="row-label">Tagessoll</div>
    <div class="soll-row">
      <span style="color:var(--muted); font-size:14px;">Soll-Arbeitszeit pro Tag</span>
      <input type="number" id="sollInput" min="0" max="24" step="0.25" value="8"> Std
    </div>
  </div>

  <div class="card">
    <div class="row-label">Stempelzeiten</div>
    <div class="card-hint">Per Knopf erfasst &middot; bei Bedarf hier korrigierbar</div>
    <div id="punchList"></div>
    <button class="add-btn" id="addBtn">+ Zeit hinzufügen</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <div id="warnBanner"></div>
  <div id="countdownBanner" class="countdown-banner" hidden></div>

  <div class="card">
    <div class="stat">
      <div class="stat-label">Netto-Arbeitszeit</div>
      <div class="stat-value" id="nettoValue">0:00</div>
    </div>
    <div class="divider"></div>
    <div class="substats">
      <div class="stat">
        <div class="stat-label" id="restLabel">Fehlt bis Soll</div>
        <div class="stat-value small" id="restValue">0:00</div>
      </div>
      <div class="stat">
        <div class="stat-label">Feierabend</div>
        <div class="stat-value small" id="feierabendValue">–</div>
      </div>
    </div>
    <div class="meta" id="metaInfo"></div>
  </div>

  <div class="card">
    <div class="row-label-line">
      <div class="row-label">Tagesfortschritt</div>
      <div class="progress-pct" id="progressPct">0%</div>
    </div>
    <div class="progress-track" id="progressTrack">
      <div class="progress-flag" id="progressFill">
        <span class="progress-car">🚓</span>
      </div>
    </div>
    <div class="timeline-labels">
      <span>0:00</span>
      <span id="progressTarget">8:00</span>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = "chip-aus-state-v1";
  const THRESH_1 = 360;   // 6h in Minuten
  const REQ_1 = 30;
  const THRESH_2 = 540;   // 9h in Minuten
  const REQ_2 = 45;

  const punchListEl = document.getElementById("punchList");
  const addBtn = document.getElementById("addBtn");
  const sollInput = document.getElementById("sollInput");
  const errorMsg = document.getElementById("errorMsg");
  const warnBanner = document.getElementById("warnBanner");
  const countdownBanner = document.getElementById("countdownBanner");
  const progressFill = document.getElementById("progressFill");
  const progressPct = document.getElementById("progressPct");
  const progressTarget = document.getElementById("progressTarget");
  const progressTrack = document.getElementById("progressTrack");
  const nettoValue = document.getElementById("nettoValue");
  const restLabel = document.getElementById("restLabel");
  const restValue = document.getElementById("restValue");
  const feierabendValue = document.getElementById("feierabendValue");
  const metaInfo = document.getElementById("metaInfo");
  const toggleBtn = document.getElementById("toggleBtn");

  // --- Feierabend-Countdown: Ton in den letzten 3 Sekunden, Anzeige ab 10 ---
  let audioCtx = null;
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
  }
  window.addEventListener("pointerdown", ensureAudio, { once: true });

  function beep(freq, durationMs, gainVal) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const t0 = audioCtx.currentTime;
      gain.gain.setValueAtTime(gainVal, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + durationMs / 1000);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + durationMs / 1000 + 0.02);
    } catch (e) {}
  }
  function playCountdownTick() { beep(880, 150, 0.25); }
  function playFeierabendChime() {
    beep(660, 150, 0.28);
    setTimeout(() => beep(990, 320, 0.28), 160);
  }

  let countdownLastSecond = null;
  let feierabendChimePlayed = false;
  let feierabendChimeAt = null;

  function resetCountdown() {
    countdownBanner.hidden = true;
    countdownLastSecond = null;
    feierabendChimePlayed = false;
    feierabendChimeAt = null;
  }

  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.times) && parsed.times.length) {
          return { times: parsed.times, soll: parsed.soll ?? 8 };
        }
      }
    } catch (e) {}
    return { times: [], soll: 8 };
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function parseHM(v) {
    if (!v) return null;
    const m = /^(\d{1,2}):(\d{2})$/.exec(v);
    if (!m) return null;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }

  function usablePrefixLength(times) {
    let n = 0;
    for (const t of times) {
      if (parseHM(t) === null) break;
      n++;
    }
    return n;
  }

  function currentHM() {
    const d = new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function setToggleButton(open) {
    if (open) {
      toggleBtn.className = "toggle-btn stop";
      toggleBtn.innerHTML = '<span class="btn-icon"></span>Stop';
    } else {
      toggleBtn.className = "toggle-btn start";
      toggleBtn.innerHTML = '<span class="btn-icon"></span>Start';
    }
  }

  function fmtDuration(totalMinutes) {
    const sign = totalMinutes < 0 ? "-" : "";
    const abs = Math.round(Math.abs(totalMinutes));
    const h = Math.floor(abs / 60);
    const m = abs % 60;
    return sign + h + ":" + String(m).padStart(2, "0");
  }

  function fmtClock(totalMinutesOfDay) {
    let m = Math.round(totalMinutesOfDay) % 1440;
    if (m < 0) m += 1440;
    const h = Math.floor(m / 60);
    const mm = m % 60;
    return String(h).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
  }

  function erforderlichePause(brutto) {
    let req = 0;
    if (brutto > THRESH_1) req = REQ_1;
    if (brutto > THRESH_2) req = REQ_2;
    return req;
  }

  // kleinste Brutto-Zeit, die die gewünschte Netto-Zeit ergibt (bei gegebener bereits genommener Pause P)
  function bruttoForNetto(target, P) {
    if (target <= THRESH_1) return Math.max(target, 0);
    const abzug2 = Math.max(0, REQ_1 - P);
    const b2 = target + abzug2;
    if (b2 <= THRESH_2) return b2;
    const abzug3 = Math.max(0, REQ_2 - P);
    return target + abzug3;
  }

  function renderProgress(netto, sollMin) {
    const target = Math.max(sollMin, 1);
    const pct = (netto / target) * 100;
    const clampedPct = Math.max(0, Math.min(100, pct));
    progressFill.style.width = clampedPct + "%";
    progressFill.className = "progress-flag" + (netto > target ? " over-cap" : "");
    progressPct.textContent = Math.round(Math.max(0, pct)) + "%";
    progressPct.className = "progress-pct" + (netto > target ? " over" : "");
    progressTarget.textContent = fmtDuration(target);

    const hour = new Date().getHours();
    const isDay = hour >= 6 && hour < 20;
    progressTrack.classList.toggle("is-day", isDay);
    progressTrack.classList.toggle("is-night", !isDay);
  }

  // Findet die "Sackgasse"-Zone, in der Weiterarbeiten die Netto-Zeit nicht erhöht.
  // Gibt {start, end, peakNetto} zurück oder null.
  function findDipZone(brutto, P) {
    const zones = [];
    const end1 = THRESH_1 + Math.max(0, REQ_1 - P);
    if (end1 > THRESH_1) {
      zones.push({ start: THRESH_1, end: end1, peakNetto: THRESH_1 });
    }
    const abzugAt540Before = Math.max(0, REQ_1 - P);
    const abzugAt540After = Math.max(0, REQ_2 - P);
    const jump2 = abzugAt540After - abzugAt540Before;
    if (jump2 > 0) {
      const peak = THRESH_2 - abzugAt540Before;
      zones.push({ start: THRESH_2, end: THRESH_2 + jump2, peakNetto: peak });
    }
    for (const z of zones) {
      if (brutto > z.start && brutto < z.end) return z;
    }
    return null;
  }

  const SWIPE_REVEAL = 84;
  let openSwipeRow = null;

  function closeSwipeRow(row) {
    if (!row) return;
    row.style.transform = "translateX(0px)";
    row.classList.remove("swiped");
    if (openSwipeRow === row) openSwipeRow = null;
  }

  function render() {
    punchListEl.innerHTML = "";
    openSwipeRow = null;

    state.times.forEach((t, i) => {
      const wrap = document.createElement("div");
      wrap.className = "punch-row-wrap";

      const swipeDel = document.createElement("button");
      swipeDel.className = "swipe-delete";
      swipeDel.type = "button";
      swipeDel.textContent = "Löschen";
      wrap.appendChild(swipeDel);

      const row = document.createElement("div");
      row.className = "punch-row";

      const doDelete = () => {
        state.times.splice(i, 1);
        saveState();
        render();
        update();
      };
      swipeDel.addEventListener("click", doDelete);

      const tag = document.createElement("div");
      const isAn = i % 2 === 0;
      tag.className = "punch-tag " + (isAn ? "an" : "aus");
      tag.textContent = isAn ? "An" : "Aus";
      row.appendChild(tag);

      const input = document.createElement("input");
      input.type = "time";
      input.value = t;
      input.addEventListener("input", (e) => {
        state.times[i] = e.target.value;
        saveState();
        update();
      });
      row.appendChild(input);

      const del = document.createElement("button");
      del.className = "del-btn";
      del.textContent = "✕";
      del.title = "Zeile löschen";
      del.addEventListener("click", doDelete);
      row.appendChild(del);

      // --- Wisch-Geste: nach links wischen legt den roten "Löschen"-Button frei.
      // Die Geste darf überall auf der Zeile starten (auch auf dem Zeitfeld) -
      // erst wenn die Bewegung eindeutig horizontal ist, übernehmen wir sie;
      // ein normaler Tipp aufs Zeitfeld öffnet weiterhin ganz normal die Uhrzeit-Auswahl.
      let dragging = false;
      let dragConfirmed = false;
      let startX = 0;
      let startY = 0;
      let startTransform = 0;
      let moved = 0;

      row.addEventListener("pointerdown", (e) => {
        dragging = true;
        dragConfirmed = false;
        moved = 0;
        startX = e.clientX;
        startY = e.clientY;
        startTransform = openSwipeRow === row ? -SWIPE_REVEAL : 0;
        row.style.transition = "none";
      });

      row.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;
        if (!dragConfirmed) {
          if (Math.abs(deltaX) > 8 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3) {
            dragConfirmed = true;
            // Falls das Zeitfeld gerade Fokus bekommen hat, dessen Uhrzeit-Auswahl
            // wieder schließen, weil das hier jetzt eindeutig ein Wisch ist.
            if (document.activeElement === input) input.blur();
          } else if (Math.abs(deltaY) > 8) {
            // eindeutig vertikal (Scrollen) -> Wisch-Geste abbrechen
            dragging = false;
            return;
          }
        }
        if (dragConfirmed) {
          moved = Math.max(moved, Math.abs(deltaX));
          const newX = Math.min(0, Math.max(-SWIPE_REVEAL, startTransform + deltaX));
          row.style.transform = "translateX(" + newX + "px)";
        }
      });

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        row.style.transition = "transform 0.18s ease";

        if (!dragConfirmed) {
          // war nur ein Tap, keine Wisch-Geste
          if (openSwipeRow === row) {
            closeSwipeRow(row);
            if (e.target === input) {
              // verhindert, dass der Tap, der die offene Zeile schließt,
              // gleichzeitig die Uhrzeit-Auswahl aufpoppen lässt
              const suppressClick = (ev) => {
                ev.preventDefault();
                ev.stopPropagation();
                input.removeEventListener("click", suppressClick, true);
              };
              input.addEventListener("click", suppressClick, true);
            }
          }
          return;
        }

        // War eine echte Wisch-Geste: den folgenden Klick auf das Zeitfeld
        // unterdrücken, damit sich die Uhrzeit-Auswahl nicht ungewollt öffnet.
        const suppressClick = (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          input.removeEventListener("click", suppressClick, true);
        };
        input.addEventListener("click", suppressClick, true);

        const deltaX = (typeof e.clientX === "number" ? e.clientX : startX) - startX;
        const finalX = startTransform + deltaX;
        if (finalX < -SWIPE_REVEAL / 2) {
          row.style.transform = "translateX(-" + SWIPE_REVEAL + "px)";
          row.classList.add("swiped");
          if (openSwipeRow && openSwipeRow !== row) closeSwipeRow(openSwipeRow);
          openSwipeRow = row;
        } else {
          closeSwipeRow(row);
        }
      }
      row.addEventListener("pointerup", endDrag);
      row.addEventListener("pointercancel", endDrag);

      wrap.appendChild(row);
      punchListEl.appendChild(wrap);
    });

    sollInput.value = state.soll;
  }

  function update() {
    errorMsg.textContent = "";
    warnBanner.innerHTML = "";
    metaInfo.textContent = "";

    setToggleButton(usablePrefixLength(state.times) % 2 === 1);

    const minutesList = state.times.map(parseHM);
    const filled = minutesList.filter((m) => m !== null);

    // Validierung: nur gefüllte, aufsteigend sortierte Werte an ihrer Position prüfen
    for (let i = 0; i < minutesList.length; i++) {
      if (minutesList[i] === null) continue;
      for (let j = 0; j < i; j++) {
        if (minutesList[j] !== null && minutesList[j] > minutesList[i]) {
          errorMsg.textContent = "Die Zeiten dürfen nicht rückwärts laufen.";
          nettoValue.textContent = "–";
          restValue.textContent = "–";
          feierabendValue.textContent = "–";
          resetCountdown();
          return;
        }
      }
    }

    // Nur vollständig ausgefüllte führende Einträge berücksichtigen (bis zur ersten Lücke)
    let usable = [];
    for (const m of minutesList) {
      if (m === null) break;
      usable.push(m);
    }

    if (usable.length === 0) {
      nettoValue.textContent = "0:00";
      restValue.textContent = fmtDuration(state.soll * 60);
      feierabendValue.textContent = "–";
      restLabel.textContent = "Fehlt bis Soll";
      renderProgress(0, Number(state.soll) * 60);
      resetCountdown();
      return;
    }

    const now = new Date();
    const nowMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

    const pairCount = Math.floor(usable.length / 2);
    const isOpen = usable.length % 2 === 1;
    const openStart = isOpen ? usable[usable.length - 1] : null;

    // Jeder Arbeitsblock (ein An/Aus-Paar bzw. der laufende Block) wird für sich
    // betrachtet: Pausen, die DANACH gemacht werden (z.B. Fitnessstudio), zählen
    // nicht rückwirkend auf die Pausenpflicht eines Blocks ein, der bereits am
    // Stück über 6 bzw. 9 Stunden ging.
    let brutto = 0;
    let bereitsPause = 0;
    let nettoClosed = 0;
    let abzugClosed = 0;
    let liveNow = null;

    for (let i = 0; i < pairCount; i++) {
      const start = usable[i * 2];
      const end = usable[i * 2 + 1];
      const blockDuration = end - start;
      brutto += blockDuration;
      if (i > 0) {
        const prevEnd = usable[i * 2 - 1];
        bereitsPause += start - prevEnd;
      }
      const blockAbzug = erforderlichePause(blockDuration);
      abzugClosed += blockAbzug;
      nettoClosed += blockDuration - blockAbzug;
    }

    let openBlockDuration = 0;
    let openAbzug = 0;
    if (isOpen) {
      liveNow = nowMinutes;
      if (liveNow < openStart) liveNow += 1440; // über Mitternacht
      openBlockDuration = liveNow - openStart;
      brutto += openBlockDuration;
      if (pairCount > 0) {
        const prevEnd = usable[pairCount * 2 - 1];
        bereitsPause += openStart - prevEnd;
      }
      openAbzug = erforderlichePause(openBlockDuration);
    }

    const abzug = abzugClosed + openAbzug;
    const netto = nettoClosed + (openBlockDuration - openAbzug);
    const sollMin = Number(state.soll) * 60;
    const rest = sollMin - netto;

    nettoValue.textContent = fmtDuration(netto);
    nettoValue.className = "stat-value" + (netto >= sollMin ? " good" : "");

    if (rest > 0) {
      restLabel.textContent = "Fehlt bis Soll";
      restValue.textContent = fmtDuration(rest);
      restValue.className = "stat-value small";
    } else {
      restLabel.textContent = "Überstunden";
      restValue.textContent = fmtDuration(-rest);
      restValue.className = "stat-value small good";
    }

    if (isOpen) {
      // Wie viel Netto muss der GERADE LAUFENDE Block noch bringen, um aufs Soll
      // zu kommen? Frühere, bereits abgeschlossene Blöcke stehen fest (nettoClosed).
      const targetNettoForOpenBlock = sollMin - nettoClosed;
      const requiredOpenBrutto = bruttoForNetto(targetNettoForOpenBlock, 0);
      const remainingMinutes = requiredOpenBrutto - openBlockDuration;
      const feierabendClock = fmtClock(nowMinutes + remainingMinutes);
      if (remainingMinutes <= 0) {
        feierabendValue.textContent = "jetzt";
        feierabendValue.className = "stat-value small good";
      } else {
        feierabendValue.textContent = feierabendClock;
        feierabendValue.className = "stat-value small";
      }

      // Countdown: ab 10 Sek. vor Feierabend anzeigen, in den letzten 3 Sek. piept's
      const remainingSeconds = remainingMinutes * 60;
      if (remainingSeconds > 10.5) {
        resetCountdown();
      } else if (remainingSeconds > 0) {
        const secLeft = Math.max(1, Math.ceil(remainingSeconds));
        countdownBanner.hidden = false;
        countdownBanner.className = "countdown-banner" + (secLeft <= 3 ? " urgent" : "");
        countdownBanner.textContent = String(secLeft);
        if (countdownLastSecond !== secLeft) {
          countdownLastSecond = secLeft;
          if (secLeft <= 3) playCountdownTick();
        }
      } else {
        if (!feierabendChimePlayed) {
          feierabendChimePlayed = true;
          feierabendChimeAt = Date.now();
          playFeierabendChime();
        }
        const sinceMs = feierabendChimeAt ? Date.now() - feierabendChimeAt : 99999;
        if (sinceMs < 8000) {
          countdownBanner.hidden = false;
          countdownBanner.className = "countdown-banner done";
          countdownBanner.textContent = "Feierabend! 🎉";
        } else {
          countdownBanner.hidden = true;
        }
      }
    } else {
      feierabendValue.textContent = "–";
      feierabendValue.className = "stat-value small";
      resetCountdown();
    }

    // Warnzone: Weiterarbeiten im LAUFENDEN Block bringt gerade nichts (bezieht
    // sich nur auf den aktuell offenen Block, nicht auf frühere Blöcke – die
    // stehen ja schon fest). Nur relevant, solange das Tagessoll noch nicht
    // erreicht ist - danach spielt die kurze "Sackgasse" keine Rolle mehr.
    if (isOpen && netto < sollMin) {
      const zone = findDipZone(openBlockDuration, 0);
      if (zone) {
        const remaining = zone.end - openBlockDuration;
        const untilClock = fmtClock(nowMinutes + remaining);
        const msg =
          "Du bist gerade in der Pausenpflicht-Zone: Weiterarbeiten erhöht deine Netto-Zeit im Moment nicht, " +
          "weil dabei die Pausenpflicht greift. Erst ab <strong>" + untilClock + "</strong> " +
          "(Blockdauer " + fmtDuration(zone.end) + ") lohnt sich Weiterarbeiten wieder.";
        warnBanner.innerHTML =
          '<div class="warn-banner"><b>⚠️ Weiterarbeiten lohnt sich gerade nicht</b>' + msg + "</div>";
      }
    }

    metaInfo.textContent =
      "Brutto " + fmtDuration(brutto) + " · bereits genommene Pause " + fmtDuration(bereitsPause) +
      " · Pausenabzug " + fmtDuration(abzug);

    renderProgress(netto, sollMin);
  }

  toggleBtn.addEventListener("click", () => {
    ensureAudio();
    const len = usablePrefixLength(state.times);
    const lastVal = len > 0 ? parseHM(state.times[len - 1]) : null;
    const nowStr = currentHM();
    const nowVal = parseHM(nowStr);
    if (lastVal !== null && nowVal < lastVal) {
      errorMsg.textContent = "Die Uhrzeit liegt vor dem letzten Stempel.";
      return;
    }
    state.times = state.times.slice(0, len);
    state.times.push(nowStr);
    saveState();
    render();
    update();
  });

  addBtn.addEventListener("click", () => {
    state.times.push("");
    saveState();
    render();
    update();
  });

  sollInput.addEventListener("input", (e) => {
    const v = parseFloat(e.target.value);
    state.soll = isNaN(v) ? 8 : v;
    saveState();
    update();
  });

  render();
  update();
  setInterval(update, 1000);
})();
</script>
</body>
</html>
